<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục 3 Cột Bootstrap</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bước 5: Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Tiêu đề trang sử dụng Font Awesome (Bước 5) -->
    <div class="container mt-4">
        <h3>
            <i class="fas fa-home me-2"></i>Trang chủ
        </h3>
    </div>

    <!-- Bước 1: Cấu trúc Grid với 3 cột và Flexbox -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border">
                <p class="mb-0">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white border">
                <p class="mb-0">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border">
                <p class="mb-0">Phần 3</p>
            </div>
        </div>
    </div>

    <!-- Bước 2: Áp dụng Margin & Padding (my-5 & py-3) -->
    <div class="container my-5 py-3 bg-light text-center border rounded">
        <h3 class="mb-0">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </div>

    <!-- Bước 3: Sử dụng Display Property (Ẩn trên màn hình nhỏ, hiện trên screen >= 768px) -->
    <div class="container mb-4">
        <div class="d-none d-md-block bg-warning text-center p-3 rounded fw-bold">
            <p class="mb-0"><i class="fas fa-desktop me-2"></i>Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px (Desktop / Tablet)</p>
        </div>
    </div>

    <!-- Bước 4: Tạo Carousel slideshow -->
    <div class="container">
        <div id="myCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
            <div class="carousel-inner rounded shadow-sm">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/1200/400?random=1" class="d-block w-100" alt="Hình ảnh 1">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?random=2" class="d-block w-100" alt="Hình ảnh 2">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/1200/400?random=3" class="d-block w-100" alt="Hình ảnh 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <!-- Bước 6: Tạo Contact Form kết hợp Font Awesome -->
    <div class="container my-5">
        <h4 class="mb-3"><i class="fas fa-envelope me-2"></i>Biểu mẫu liên hệ</h4>
        <form class="p-4 border rounded bg-light">
            <div class="mb-3">
                <label for="name" class="form-label fw-bold">Họ và tên</label>
                <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Nhập email">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label fw-bold">Nội dung</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-paper-plane me-1"></i> Gửi
            </button>
        </form>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
